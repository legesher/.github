name: Welcome tests

on:
  pull_request:
    paths:
      - 'actions/welcome/**'
      - '.github/workflows/welcome-tests.yml'
  push:
    branches: [main]
    paths:
      - 'actions/welcome/**'
      - '.github/workflows/welcome-tests.yml'
  # Links can die without anything here changing, so check them monthly too.
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test 'actions/welcome/test/*.test.js'

  links:
    name: Links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node actions/welcome/check-links.js actions/welcome/messages
